<ul class="list">
  @for (row of rows(); track row.conversation.id) {
    <li>
      <a
        class="row"
        [class.row--selected]="row.conversation.id === selectedId()"
        [attr.aria-current]="row.conversation.id === selectedId() ? 'page' : null"
        routerLink="/conversas"
        [queryParams]="{ id: row.conversation.id }"
      >
        <po-avatar [p-src]="row.conversation.avatarUrl ?? ''" p-size="sm" />
        <span class="row__body">
          <span class="row__top">
            <span class="row__title">{{ row.conversation.title }}</span>
            <span class="row__time">{{ row.time }}</span>
          </span>
          <span class="row__preview">{{ row.preview }}</span>
          @if (row.unread; as unread) {
            <span class="row__unread">{{ unread }}</span>
          }
        </span>
      </a>
    </li>
  }
</ul>
