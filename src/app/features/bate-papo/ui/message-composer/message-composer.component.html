<form class="composer" (ngSubmit)="submit()">
  <po-textarea
    class="composer__field"
    name="message"
    [p-label]="label()"
    p-placeholder="Escreva aqui"
    [p-rows]="2"
    [ngModel]="text()"
    (ngModelChange)="text.set($event ?? '')"
    (keydown.enter)="onEnter($event)"
  />
  <po-button p-kind="primary" p-label="Enviar" [p-type]="submitType" />
  @if (error(); as message) {
    <p class="composer__error" role="alert">{{ message }}</p>
  }
</form>
