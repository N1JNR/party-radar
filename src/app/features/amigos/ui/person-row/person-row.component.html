<div class="person">
  <po-avatar [p-src]="person().avatarUrl ?? ''" p-size="sm" />
  <div class="person__who">
    <p class="person__name">{{ person().name }}</p>
    <p class="person__line">&#64;{{ person().username }}</p>
    @if (status(); as text) {
      <p class="person__status">{{ text }}</p>
    }
  </div>
  <div class="person__actions"><ng-content /></div>
</div>
