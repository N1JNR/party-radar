<main class="login">
  <div class="login__content">
    <app-radar-hero class="login__radar" />
    <h1 class="login__title">Party Radar</h1>
    <p class="login__tagline">Veja quem do seu grupo está jogando agora e chame a galera.</p>

    <div class="login__actions">
      @for (provider of providers; track provider) {
        <app-provider-button
          [attr.data-provider]="provider"
          [provider]="provider"
          [opening]="opening(provider)"
          [disabled]="busy()"
          (pressed)="signIn(provider)"
        />
      }
    </div>
  </div>

  <!-- Fora do bloco centralizado: o aviso aparece sem mudar os botões de lugar. -->
  <div class="login__footer">
    <div class="login__feedback" aria-live="polite">
      @if (feedback(); as feedback) {
        <p class="login__alert" [class.login__alert--error]="feedback.tone === 'error'">
          <po-icon
            class="login__alert-icon"
            [p-icon]="feedback.tone === 'error' ? 'an an-warning-circle' : 'an an-info'"
            aria-hidden="true"
          />
          <span>{{ feedback.message }}</span>
        </p>
      }
    </div>

    <p class="login__note">Usamos seu nome e foto do Discord para criar seu perfil.</p>
  </div>
</main>
