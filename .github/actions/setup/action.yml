name: Preparar o projeto
description: Node do .nvmrc, npm do packageManager e dependências pelo lockfile (npm ci), com cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Usar o npm declarado no package.json
      shell: bash
      run: npm install -g "$(node -p "require('./package.json').packageManager")"

    - name: Instalar dependências
      shell: bash
      run: npm ci
